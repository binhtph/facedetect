name: Docker

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ADDON_REPO: anhnvme/hass-facedetect-addon

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
    paths-ignore:
      - "README.md"
      - "README_vi.md"
      - "technical.md"
      - "technical_vi.md"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADDON_REPO_TOKEN: ${{ secrets.ADDON_REPO_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=IRIS Face Recognition
            org.opencontainers.image.description=Local InsightFace recognition with Home Assistant MQTT support

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## " version "([[:space:]-]|$)" { in_section=1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

      - name: Checkout Home Assistant add-on repo
        if: startsWith(github.ref, 'refs/tags/v') && env.ADDON_REPO_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ env.ADDON_REPO }}
          path: addon
          token: ${{ env.ADDON_REPO_TOKEN }}

      - name: Update Home Assistant add-on version
        if: startsWith(github.ref, 'refs/tags/v') && env.ADDON_REPO_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="${REGISTRY}/${IMAGE_NAME}:${version}"
          export version image

          perl -0pi -e 's/version: "[^"]+"/version: "$ENV{version}"/' addon/iris_face_recognition/config.yaml
          perl -0pi -e 's#FROM ghcr\.io/anhnvme/facedetect:\S+#FROM $ENV{image}#' addon/iris_face_recognition/Dockerfile
          perl -0pi -e 's#ghcr\.io/anhnvme/facedetect:[^`\s]+#$ENV{image}#g' addon/README.md addon/iris_face_recognition/README.md

          if git -C addon diff --quiet; then
            echo "Add-on repo already points to ${version}."
            exit 0
          fi

          git -C addon config user.name "github-actions[bot]"
          git -C addon config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C addon add iris_face_recognition/config.yaml iris_face_recognition/Dockerfile README.md iris_face_recognition/README.md
          git -C addon commit -m "Release add-on ${version}"
          git -C addon push

      - name: Skip Home Assistant add-on update
        if: startsWith(github.ref, 'refs/tags/v') && env.ADDON_REPO_TOKEN == ''
        run: |
          echo "::warning::ADDON_REPO_TOKEN is not configured; skipped updating ${ADDON_REPO}."
