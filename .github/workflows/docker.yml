name: Docker

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Home Assistant add-on repo + folder that wraps this image
  ADDON_REPO: binhtph/ha-addons
  ADDON_DIR: facedetect

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
    paths-ignore:
      - "README.md"
      - "README_vi.md"
      - "technical.md"
      - "technical_vi.md"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADDON_REPO_TOKEN: ${{ secrets.ADDON_REPO_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=IRIS Face Recognition
            org.opencontainers.image.description=Local InsightFace recognition with Home Assistant MQTT support

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## " version "([[:space:]-]|$)" { in_section=1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

      # ---- Home Assistant add-on: pin to the released image ----
      # On a v1.2.3 tag: set FROM ghcr.io/binhtph/facedetect:1.2.3 and
      # version "1.2.3" in the add-on, so HA offers the update and rebuilds on
      # exactly that image. Pushes to main only build latest/sha-* images.
      - name: Checkout Home Assistant add-on repo
        if: startsWith(github.ref, 'refs/tags/v') && env.ADDON_REPO_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ env.ADDON_REPO }}
          path: addon
          token: ${{ env.ADDON_REPO_TOKEN }}

      - name: Update Home Assistant add-on version
        if: startsWith(github.ref, 'refs/tags/v') && env.ADDON_REPO_TOKEN != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          image="${REGISTRY}/${IMAGE_NAME}"
          dir="addon/${ADDON_DIR}"

          sed -i -E "s/^version:.*/version: \"${version}\"/" "${dir}/config.yaml"
          sed -i -E "s#^FROM ${image}:[^[:space:]]+#FROM ${image}:${version}#" "${dir}/Dockerfile"
          sed -i -E "s#${image}:[^\`[:space:]]+#${image}:${version}#g" "${dir}/README.md"

          if git -C addon diff --quiet; then
            echo "Add-on already uses ${image}:${version}; nothing to do."
            exit 0
          fi

          changelog="${dir}/CHANGELOG.md"
          if [[ -f "$changelog" ]] && head -n1 "$changelog" | grep -q '^# '; then
            ENTRY="$(printf '## %s - %s\n\n- Image `%s:%s`, digest `%s`\n- Source: %s@%s\n' \
              "$version" "$(date -u +%F)" "$image" "$version" "$DIGEST" "$GITHUB_REPOSITORY" "${GITHUB_SHA::7}")" \
              awk 'NR==1 { print; print ""; print ENVIRON["ENTRY"]; next } { print }' "$changelog" > "$changelog.new"
            mv "$changelog.new" "$changelog"
          fi

          git -C addon config user.name "github-actions[bot]"
          git -C addon config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C addon add "${ADDON_DIR}"
          git -C addon commit \
            -m "${ADDON_DIR}: ${version}" \
            -m "Image ${image}:${version} @ ${DIGEST}" \
            -m "Source ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          for attempt in 1 2 3; do
            git -C addon push && exit 0
            echo "Push rejected (attempt ${attempt}); rebasing on latest ${ADDON_REPO}..."
            git -C addon pull --rebase
          done
          exit 1

      - name: Skip Home Assistant add-on update
        if: startsWith(github.ref, 'refs/tags/v') && env.ADDON_REPO_TOKEN == ''
        run: |
          echo "::warning::ADDON_REPO_TOKEN is not configured; skipped updating ${ADDON_REPO}."
