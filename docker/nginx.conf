server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    root /app/dist/client;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    # Under Home Assistant ingress the browser sees /api/hassio_ingress/<token>/...;
    # point the server-rendered asset links at that prefix (empty when accessed directly).
    proxy_set_header Accept-Encoding "";
    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter '"/assets/' '"$http_x_ingress_path/assets/';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
