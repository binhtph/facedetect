blueprint:
  name: "IRIS – Chào khi cửa mở (Telegram + loa)"
  author: binhtph
  source_url: https://github.com/binhtph/facedetect/blob/main/blueprints/automation/iris_door_greeting.yaml
  domain: automation
  homeassistant:
    min_version: "2025.4.0"
  description: >-
    Cửa vừa mở → biết ai vừa vào nhờ **IRIS** → loa đọc lời chào và gửi tin
    Telegram vui vẻ:


    - **Người nhà** (trong danh sách): lời chào riêng từng người.

    - **Người quen**: lời chào riêng nếu có, không thì lời chào chung.

    - **Người lạ / chưa chắc chắn**: lời chào khách.


    Nếu IRIS vừa nhận ra người quen ở camera cửa (ví dụ automation mở cửa vừa
    chạy) thì dùng luôn kết quả đó, không chụp lại. Không thì bấm nút chụp của IRIS
    và chờ kết quả. Lời chào và tin nhắn dùng được `{name}` `{confidence}`
    `{camera}` `{buoi}` `{gio}` `{faces}` `{reason}`.


    Trong IRIS: đặt **Cooldown** của camera cửa thấp (0–5 giây), nếu không IRIS sẽ
    bỏ qua lần chụp.
  input:
    start_section:
      name: "① Khi nào chào"
      icon: mdi:door-open
      input:
        door_sensor:
          name: Cảm biến cửa
          description: Chuyển từ đóng sang mở là bắt đầu.
          default: binary_sensor.living_room_door_contact
          selector:
            entity:
              filter:
                - domain: binary_sensor
        extra_triggers:
          name: Trigger khác
          description: Ví dụ nút bấm, chuông cửa.
          default: []
          selector:
            trigger: {}
        start_conditions:
          name: Điều kiện để chào
          description: Để trống = luôn chào.
          default: []
          selector:
            condition: {}
        cooldown:
          name: Không chào lại trong
          description: Cửa mở nhiều lần liên tiếp thì chỉ chào lần đầu.
          default: 60
          selector:
            number:
              min: 0
              max: 900
              step: 10
              unit_of_measurement: s
              mode: slider

    iris_section:
      name: "② IRIS"
      icon: mdi:face-recognition
      input:
        iris_button:
          name: Nút chụp của IRIS
          description: Nút "Trigger …" IRIS tạo cho camera cửa.
          selector:
            entity:
              filter:
                - integration: mqtt
                  domain: button
        iris_camera_name:
          name: Tên camera trong IRIS
          description: Để trống = lấy từ tên nút chụp ("… Trigger Cửa chính" → Cửa chính).
          default: ""
          selector:
            text: {}
        latest_event_sensor:
          name: Cảm biến kết quả mới nhất của IRIS
          default: sensor.iris_face_recognition_latest_recognition_event
          selector:
            entity:
              filter:
                - domain: sensor
        reuse_seconds:
          name: Dùng lại kết quả nhận ra người quen trong vòng
          description: 0 = luôn chụp lại.
          default: 60
          selector:
            number:
              min: 0
              max: 600
              step: 10
              unit_of_measurement: s
              mode: slider
        retries:
          name: Chụp lại khi không thấy mặt
          default: 1
          selector:
            number:
              min: 0
              max: 3
              step: 1
              mode: slider
        retry_delay:
          name: Chờ trước khi chụp lại
          default: 2
          selector:
            number:
              min: 1
              max: 15
              step: 1
              unit_of_measurement: s
              mode: slider
        result_timeout:
          name: Chờ kết quả IRIS tối đa
          default: 15
          selector:
            number:
              min: 5
              max: 60
              step: 1
              unit_of_measurement: s
              mode: slider
        event_topic:
          name: MQTT topic kết quả
          default: iris/event
          selector:
            text: {}
        iris_image:
          name: Ảnh nhận diện mới nhất của IRIS
          default: image.iris_face_recognition_latest_snapshot
          selector:
            entity:
              filter:
                - domain: image
        snapshot_file:
          name: File lưu ảnh gửi kèm
          default: /media/snapshots/iris_chao.jpg
          selector:
            text: {}

    people_section:
      name: "③ Lời chào"
      icon: mdi:account-heart
      description: Để trống một lời chào = không đọc trường hợp đó.
      input:
        family_people:
          name: Người nhà
          description: Tên hoặc biệt danh đúng như trong IRIS. Người IRIS biết nhưng không có ở đây là người quen.
          default:
            - Bình
            - Táo
          selector:
            text:
              multiple: true
        greetings:
          name: Lời chào riêng từng người (người nhà và người quen)
          description: >-
            Tên: lời chào. Ghi nhiều câu dạng danh sách để chọn ngẫu nhiên. Dùng được
            {name} {buoi} {gio}.
          default:
            Bình:
              - Chào mừng anh Bình về nhà!
              - Anh Bình về rồi. Chúc anh {buoi} vui vẻ!
            Táo: Táo ơi, mừng con về nhà!
          selector:
            object: {}
        family_default:
          name: Lời chào người nhà (chưa có lời chào riêng)
          default: Chào mừng {name} về nhà!
          selector:
            text: {}
        known_default:
          name: Lời chào người quen (chưa có lời chào riêng)
          default: Xin chào {name}, rất vui được gặp bạn!
          selector:
            text: {}
        review_tts:
          name: Lời chào khi chưa chắc là ai
          default: Xin chào, mời bạn vào nhà!
          selector:
            text: {}
        unknown_tts:
          name: Lời chào khách lạ
          default: Xin chào quý khách, chào mừng đến chơi nhà!
          selector:
            text: {}
        no_face_tts:
          name: Khi không thấy khuôn mặt
          default: ""
          selector:
            text: {}
        group_tts:
          name: Thêm khi có nhiều người
          default: Chào mừng mọi người!
          selector:
            text: {}

    speaker_section:
      name: "④ Loa"
      icon: mdi:speaker
      input:
        tts_enabled:
          name: Đọc lời chào qua loa
          default: true
          selector:
            boolean: {}
        speaker:
          name: Loa
          default: media_player.living_room_speaker
          selector:
            entity:
              filter:
                - domain: media_player
        tts_entity:
          name: Giọng đọc (TTS)
          default: tts.google_translate_en_com
          selector:
            entity:
              filter:
                - domain: tts
        tts_language:
          name: Ngôn ngữ đọc
          description: vi = tiếng Việt. Để trống = theo cài đặt của TTS.
          default: vi
          selector:
            text: {}
        tts_volume:
          name: Âm lượng khi đọc
          description: >-
            0 = giữ nguyên. Nếu loa đang phát nhạc thì đọc xong trả lại âm lượng cũ (loa đang
            tắt thì Home Assistant không biết âm lượng cũ nên giữ mức này).
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        tts_conditions:
          name: Điều kiện để loa đọc
          description: Ví dụ chế độ an ninh là Có nhà / Tắt. Để trống = luôn đọc.
          default: []
          selector:
            condition: {}

    notify_section:
      name: "⑤ Tin nhắn"
      icon: mdi:send
      input:
        notify_script:
          name: Script gửi thông báo
          default: script.notify_phones
          selector:
            entity:
              filter:
                - domain: script
        phones:
          name: Điện thoại nhận qua app
          description: Để trống = chỉ gửi Telegram.
          default: []
          selector:
            select:
              multiple: true
              custom_value: true
              options:
                - brians_iphone
                - thoais_iphone
                - taos_ipad
        use_telegram:
          name: Gửi Telegram
          default: true
          selector:
            boolean: {}
        send_photo:
          name: Gửi kèm ảnh IRIS
          default: true
          selector:
            boolean: {}
        title_name:
          name: Tên trong tiêu đề
          default: CỬA CHÍNH
          selector:
            text: {}
        notify_cases:
          name: Gửi tin khi
          default:
            - family
            - known
            - review
            - unknown
          selector:
            select:
              multiple: true
              options:
                - label: Người nhà về
                  value: family
                - label: Người quen đến
                  value: known
                - label: Chưa chắc là ai
                  value: review
                - label: Khách lạ
                  value: unknown
                - label: Không thấy khuôn mặt
                  value: no_face
                - label: IRIS lỗi / không trả lời
                  value: error
        msg_family:
          name: "Tin: người nhà về"
          default: "{name} vừa về nhà. Chúc {buoi} vui vẻ!"
          selector:
            text: {}
        msg_known:
          name: "Tin: người quen đến"
          default: "{name} vừa đến chơi nhà."
          selector:
            text: {}
        msg_review:
          name: "Tin: chưa chắc là ai"
          default: "Có thể là {name} vừa vào nhà (khớp {confidence}%)."
          selector:
            text: {}
        msg_unknown:
          name: "Tin: khách lạ"
          default: "Có khách lạ vừa vào nhà."
          selector:
            text: {}
        msg_no_face:
          name: "Tin: không thấy khuôn mặt"
          default: "Cửa vừa mở, camera không thấy khuôn mặt."
          selector:
            text: {}
        msg_error:
          name: "Tin: IRIS lỗi"
          default: "Cửa vừa mở nhưng IRIS không nhận diện được: {reason}."
          selector:
            text: {}

mode: queued
max: 5
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input door_sensor
    from: "off"
    to: "on"
    id: start
  - triggers: !input extra_triggers

variables:
  iris_button: !input iris_button
  iris_camera_name: !input iris_camera_name
  latest_event_sensor: !input latest_event_sensor
  reuse_seconds: !input reuse_seconds
  cooldown: !input cooldown
  retries: !input retries
  retry_delay: !input retry_delay
  result_timeout: !input result_timeout
  iris_image: !input iris_image
  snapshot_file: !input snapshot_file
  family_people: !input family_people
  greetings: !input greetings
  defaults:
    family: !input family_default
    known: !input known_default
    review: !input review_tts
    unknown: !input unknown_tts
    no_face: !input no_face_tts
  group_tts: !input group_tts
  tts_enabled: !input tts_enabled
  speaker: !input speaker
  tts_entity: !input tts_entity
  tts_language: !input tts_language
  tts_volume: !input tts_volume
  phones: !input phones
  use_telegram: !input use_telegram
  send_photo: !input send_photo
  title_name: !input title_name
  notify_cases: !input notify_cases
  messages:
    family: !input msg_family
    known: !input msg_known
    review: !input msg_review
    unknown: !input msg_unknown
    no_face: !input msg_no_face
    error: !input msg_error
    timeout: !input msg_error
  titles:
    family: 🏡|NGƯỜI NHÀ VỀ
    known: 👋|KHÁCH QUEN
    review: 🤔|CHƯA RÕ AI
    unknown: 🙋|KHÁCH LẠ
    no_face: 🚪|CỬA MỞ
    error: ⚠️|IRIS LỖI
    timeout: ⚠️|IRIS KHÔNG TRẢ LỜI
  buoi: >-
    {% set h = now().hour %}{{ 'buổi sáng' if h < 11 else 'buổi trưa' if h < 13 else 'buổi chiều' if h < 18 else 'buổi tối' }}
  gio: "{{ now().strftime('%H:%M') }}"
  camera_lc: >-
    {% set n = iris_camera_name | string | trim %}
    {%- if n == '' %}{% set fn = state_attr(iris_button, 'friendly_name') | string %}
    {%- set n = fn.split('Trigger ')[-1] if 'Trigger ' in fn else '' %}{% endif %}
    {{- n | trim | lower }}
  recent: >-
    {% set s = expand(latest_event_sensor) if latest_event_sensor else [] %}
    {{ dict(s[0].attributes) if s | count > 0 else {} }}
  # Filled in while the run goes on.
  attempt: 0
  timed_out: false
  ev: {}
  source: ""

conditions:
  # Checked when the trigger fires: no greeting while one is running or right after one.
  - alias: Không chào lại liên tục
    condition: template
    value_template: >-
      {{ (this.attributes.current | default(0) | int(0)) == 0 and (this.attributes.last_triggered is none
      or as_timestamp(now()) - as_timestamp(this.attributes.last_triggered) >= cooldown | float(0)) }}

actions:
  - alias: Điều kiện để chào
    condition: and
    conditions: !input start_conditions

  - alias: Ai vừa vào nhà?
    if:
      # Not a result this automation already greeted (its own last shot).
      - alias: IRIS vừa nhận ra người quen ở camera cửa
        condition: template
        value_template: >-
          {% set t = as_timestamp(recent.get('latest_time', ''), 0) %}
          {%- set own_scan_end = as_timestamp(this.attributes.last_triggered, 0)
              + (retries | int(0) + 1) * (result_timeout | int(15) + retry_delay | int(2)) + 2 %}
          {{- reuse_seconds | int(0) > 0 and recent.get('latest_type', '') == 'known'
          and (camera_lc == '' or (recent.get('latest_camera', '') | string | trim | lower) == camera_lc)
          and as_timestamp(now()) - t <= reuse_seconds | int(0)
          and t > own_scan_end }}
    then:
      - variables:
          ev: "{{ recent }}"
          source: recent
    else:
      - if:
          - condition: template
            value_template: "{{ states(iris_button) == 'unavailable' }}"
        then:
          - variables:
              ev:
                latest_type: error
                latest_person: IRIS đang mất kết nối
              source: offline
        else:
          - repeat:
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ attempt > 0 }}"
                  then:
                    - delay:
                        seconds: "{{ retry_delay | int(2) }}"
                - variables:
                    attempt: "{{ attempt + 1 }}"
                - action: button.press
                  target:
                    entity_id: "{{ iris_button }}"
                - if:
                    - condition: template
                      value_template: "{{ camera_lc != '' }}"
                  then:
                    - wait_for_trigger:
                        - trigger: mqtt
                          topic: !input event_topic
                          payload: "{{ camera_lc }}"
                          value_template: "{{ value_json.latest_camera | default('') | string | trim | lower }}"
                      timeout:
                        seconds: "{{ result_timeout | int(15) }}"
                      continue_on_timeout: true
                    - variables:
                        timed_out: "{{ wait.trigger is none }}"
                        ev: >-
                          {{ wait.trigger.payload_json if wait.trigger and wait.trigger.payload_json is defined
                          and wait.trigger.payload_json is mapping else {} }}
                  else:
                    - wait_for_trigger:
                        - trigger: mqtt
                          topic: !input event_topic
                      timeout:
                        seconds: "{{ result_timeout | int(15) }}"
                      continue_on_timeout: true
                    - variables:
                        timed_out: "{{ wait.trigger is none }}"
                        ev: >-
                          {{ wait.trigger.payload_json if wait.trigger and wait.trigger.payload_json is defined
                          and wait.trigger.payload_json is mapping else {} }}
              until:
                - condition: template
                  value_template: >-
                    {{ timed_out or ev.get('latest_type', '') != 'no_face' or attempt > retries | int(0) }}
          - variables:
              source: scan

  - alias: Đọc kết quả
    variables:
      etype: "{{ ev.get('latest_type', '') | string | lower }}"
      camera: "{{ ev.get('latest_camera', '') | string | trim or (iris_camera_name or 'camera cửa') }}"
      person: "{{ ev.get('latest_person', '') | string | trim }}"
      confidence: "{{ ev.get('latest_confidence', 0) | float(0) }}"
      faces: "{{ ev.get('faces_in_image', 1) | int(1) }}"
      names_lc: >-
        {{ [ev.get('latest_person', ''), ev.get('latest_person_alias', ''), ev.get('latest_person_name', '')]
        | map('string') | map('trim') | map('lower') | reject('eq', '') | list }}
      is_family: >-
        {{ names_lc | select('in', family_people | map('string') | map('trim') | map('lower') | list) | list | count > 0 }}
      case: >-
        {% if timed_out %}timeout
        {%- elif etype == 'known' %}{{ 'family' if is_family else 'known' }}
        {%- elif etype in ['review', 'unknown', 'no_face', 'error'] %}{{ etype }}
        {%- else %}error{% endif %}
  - alias: Soạn lời chào và tin nhắn
    variables:
      greeting: >-
        {% set ns = namespace(g=none) %}
        {%- if case in ['family', 'known'] and greetings is mapping %}{% for k, v in greetings.items() %}
        {%- if ns.g is none and (k | string | trim | lower) in names_lc %}{% set ns.g = v %}{% endif %}
        {%- endfor %}{% endif %}
        {%- if ns.g is string and ns.g | trim != '' %}{{ ns.g }}
        {%- elif ns.g is iterable and ns.g is not string and ns.g is not mapping and ns.g | count > 0 %}{{ ns.g | random }}
        {%- else %}{{ defaults.get(case, '') }}{% endif %}
      fill:
        name: "{{ person if case in ['family', 'known', 'review'] else 'khách' }}"
        confidence: "{{ confidence | round(0) | int }}"
        camera: "{{ camera }}"
        buoi: "{{ buoi }}"
        gio: "{{ gio }}"
        faces: "{{ faces }}"
        reason: >-
          {{ ('IRIS không trả kết quả sau ' ~ (result_timeout | int) ~ ' giây') if case == 'timeout' else person }}
      tts_text: >-
        {% set ns = namespace(t=greeting | string) %}
        {%- for k, v in fill.items() %}{% set ns.t = ns.t | replace('{' ~ k ~ '}', v | string) %}{% endfor %}
        {%- if ns.t | trim != '' and faces > 1 and group_tts | string | trim != '' %}{% set ns.t = ns.t | trim ~ ' ' ~ group_tts %}{% endif %}
        {{- ns.t | trim }}
      message: >-
        {% set ns = namespace(t=messages.get(case, '') | string) %}
        {%- for k, v in fill.items() %}{% set ns.t = ns.t | replace('{' ~ k ~ '}', v | string) %}{% endfor %}
        {{- ns.t | trim }}
        {%- if faces > 1 and case in ['family', 'known', 'review', 'unknown'] %} Ảnh có {{ faces }} khuôn mặt.{% endif %}
      notify_key: "{{ 'error' if case == 'timeout' else case }}"
      title: >-
        {% set icon, label = titles.get(case, '⚠️|IRIS').split('|') %}{{ icon }} {{ title_name }} › {{ label }}
      want_photo: "{{ send_photo and case in ['family', 'known', 'review', 'unknown', 'no_face'] }}"
      event_ts: "{{ as_timestamp(ev.get('latest_time', ''), 0) }}"

  - parallel:
      - alias: Loa
        if:
          - condition: template
            value_template: "{{ tts_enabled and tts_text != '' }}"
          - condition: and
            conditions: !input tts_conditions
        then:
          - variables:
              prev_volume: "{{ state_attr(speaker, 'volume_level') }}"
              set_volume: "{{ tts_volume | int(0) > 0 }}"
          - if:
              - condition: template
                value_template: "{{ set_volume }}"
            then:
              - action: media_player.volume_set
                target:
                  entity_id: "{{ speaker }}"
                data:
                  volume_level: "{{ (tts_volume | int(0)) / 100 }}"
                continue_on_error: true
          - action: tts.speak
            target:
              entity_id: "{{ tts_entity }}"
            data: >-
              {% set d = {'media_player_entity_id': speaker, 'message': tts_text, 'cache': true} %}
              {%- if tts_language | string | trim != '' %}{% set d = dict(d, language=tts_language | string | trim) %}{% endif %}
              {{- d }}
            continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ set_volume and prev_volume is number }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ not is_state(speaker, 'playing') }}"
                then:
                  - wait_for_trigger:
                      - trigger: state
                        entity_id: !input speaker
                        to: playing
                    timeout:
                      seconds: 8
                    continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ is_state(speaker, 'playing') }}"
                then:
                  - wait_for_trigger:
                      - trigger: state
                        entity_id: !input speaker
                        from: playing
                    timeout:
                      seconds: 60
                    continue_on_timeout: true
              - action: media_player.volume_set
                target:
                  entity_id: "{{ speaker }}"
                data:
                  volume_level: "{{ prev_volume }}"
                continue_on_error: true

      - alias: Tin nhắn
        if:
          - condition: template
            value_template: "{{ notify_key in notify_cases and message != '' }}"
        then:
          - alias: Chờ IRIS gửi ảnh của lần nhận diện này
            if:
              - condition: template
                value_template: >-
                  {{ want_photo and event_ts > 0 and as_timestamp(states(iris_image), 0) < event_ts - 1 }}
            then:
              - wait_for_trigger:
                  - trigger: state
                    entity_id: !input iris_image
                    not_to:
                      - unavailable
                      - unknown
                timeout:
                  seconds: 8
                continue_on_timeout: true
          - variables:
              photo: >-
                {{ snapshot_file if want_photo and event_ts > 0
                and as_timestamp(states(iris_image), 0) >= event_ts - 1 else '' }}
          - if:
              - condition: template
                value_template: "{{ photo != '' }}"
            then:
              - action: image.snapshot
                target:
                  entity_id: "{{ iris_image }}"
                data:
                  filename: "{{ photo }}"
                continue_on_error: true
          - action: !input notify_script
            continue_on_error: true
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              phones: "{{ phones }}"
              photo: "{{ photo }}"
              ios_data: >-
